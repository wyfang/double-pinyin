<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decode</title>
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="32" fill="%23000"/><path d="M18 33.5 28 43l18-22" fill="none" stroke="%23fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    />
    <link
      rel="stylesheet"
      href="./assets/fonts/noto-serif-sc/400.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" data-state="loading">
      <div
        id="loadingProgress"
        class="loading-progress"
        role="progressbar"
        aria-label="词典加载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      ></div>
      <button id="themeToggle" class="theme-toggle" type="button">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div id="loading" class="loading">
        <div id="loadingTitle">loading</div>
        <div id="loadingDetail" class="loading-detail"></div>
      </div>
      <section id="stage" class="stage" hidden>
        <div id="textViewport" class="text-viewport">
          <div id="textFrame" class="text-frame">
            <textarea
              id="sourceText"
              class="text-content"
              aria-label="双拼编码"
              spellcheck="false"
              autocapitalize="none"
              inputmode="latin"
              rows="1"
            ></textarea>
            <div
              id="decodedText"
              class="text-content decoded-copy"
              aria-live="polite"
              hidden
            ></div>
            <div
              id="decodedMeasure"
              class="text-content decoded-copy text-measure"
              aria-hidden="true"
            ></div>
            <span id="emptyInputCaret" class="empty-input-caret" aria-hidden="true"></span>
          </div>
        </div>
        <button id="actionButton" class="action" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 16.6 13.2 22 24 10" />
          </svg>
          <span class="clear-label">清空</span>
          <span id="shortcutLabel" class="shortcut-label">ENTER</span>
        </button>
      </section>
    </main>

    <script src="./scripts/text-effects.js" defer></script>
    <script src="./scripts/app.js" defer></script>
  </body>
</html>
